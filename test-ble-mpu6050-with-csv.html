<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test BLE - MPU6050</title>
<style>
  body { font-family: monospace; padding: 20px; background: #111; color: #eee; }
  button { font-size: 16px; padding: 10px 20px; margin-bottom: 20px; }
  #output { font-size: 20px; white-space: pre-line; }
  #log { font-size: 12px; color: #888; margin-top: 20px; white-space: pre-line; }
</style>
</head>
<body>

<button id="connectBtn">Se connecter</button>
<button id="recordBtn" disabled>Arrêter l'enregistrement</button>
<button id="resetBtn" disabled>Réinitialiser</button>
<button id="exportBtn" disabled>Afficher le CSV</button>

<div id="output">En attente de connexion...</div>
<div id="count">Échantillons enregistrés : 0</div>
<textarea id="csvOutput" style="display:none; width:100%; height:200px; margin-top:10px; font-family:monospace; font-size:12px;" readonly></textarea>
<div id="log"></div>

<script>
// UUID identiques à ceux définis côté ESP32
const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

const connectBtn = document.getElementById('connectBtn');
const recordBtn = document.getElementById('recordBtn');
const resetBtn = document.getElementById('resetBtn');
const exportBtn = document.getElementById('exportBtn');
const output = document.getElementById('output');
const countEl = document.getElementById('count');
const log = document.getElementById('log');

// Tableau qui va accumuler toutes les mesures reçues
let data = [];
let startTime = null;
let recording = true; // true = les données reçues sont stockées dans le buffer

function addLog(msg) {
  log.textContent += msg + '\n';
  console.log(msg);
}

async function connect() {
  try {
    addLog('Recherche de l\'appareil...');
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SERVICE_UUID]
    });
    addLog('Appareil sélectionné : ' + device.name);

    const server = await device.gatt.connect();
    addLog('Connecté au serveur GATT');

    const service = await server.getPrimaryService(SERVICE_UUID);
    addLog('Service trouvé');

    const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
    addLog('Caractéristique trouvée');

    await characteristic.startNotifications();
    addLog('Notifications activées, en attente de données...');
    startTime = performance.now();
    recordBtn.disabled = false;
    resetBtn.disabled = false;

    characteristic.addEventListener('characteristicvaluechanged', (event) => {
      const value = event.target.value; // DataView
      const text = new TextDecoder().decode(value);

      const parts = text.split(',');
      if (parts.length === 3) {
        const x = parseFloat(parts[0]);
        const y = parseFloat(parts[1]);
        const z = parseFloat(parts[2]);
        output.textContent = `X: ${x}\nY: ${y}\nZ: ${z}`;

        // On ne stocke que si l'enregistrement est actif.
        // Les notifications continuent d'arriver même en pause,
        // on les ignore simplement ici plutôt que de les stocker.
        if (recording) {
          const t = ((performance.now() - startTime) / 1000).toFixed(3);
          data.push({ t, x, y, z });
          countEl.textContent = 'Échantillons enregistrés : ' + data.length;
          exportBtn.disabled = false;
        }
      } else {
        output.textContent = 'Texte reçu (format inattendu) : ' + text;
      }
    });

  } catch (error) {
    addLog('Erreur : ' + error.message);
  }
}

const csvOutput = document.getElementById('csvOutput');

function exportCSV() {
  if (data.length === 0) return;

  // Ligne d'en-tête, puis une ligne par mesure
  let csv = 'temps_s,accel_x,accel_y,accel_z\n';
  csv += data.map(d => `${d.t},${d.x},${d.y},${d.z}`).join('\n');

  // Affichage direct dans la page : fonctionne partout, sans dépendre
  // des mécanismes de téléchargement du navigateur.
  csvOutput.style.display = 'block';
  csvOutput.value = csv;
  csvOutput.focus();
  csvOutput.select(); // sélectionne tout le texte automatiquement pour faciliter le copier-coller
  addLog('CSV affiché ci-dessus, sélectionné. Copie-le (appui long > Copier).');
}

function toggleRecording() {
  recording = !recording;
  recordBtn.textContent = recording ? "Arrêter l'enregistrement" : "Reprendre l'enregistrement";
  addLog(recording ? 'Enregistrement repris.' : 'Enregistrement en pause (les notifications continuent d\'arriver mais ne sont plus stockées).');
}

function resetBuffer() {
  data = [];
  startTime = performance.now(); // les temps repartent à 0 pour le prochain enregistrement
  countEl.textContent = 'Échantillons enregistrés : 0';
  exportBtn.disabled = true;
  csvOutput.style.display = 'none';
  csvOutput.value = '';
  addLog('Buffer réinitialisé.');
}

connectBtn.addEventListener('click', connect);
exportBtn.addEventListener('click', exportCSV);
recordBtn.addEventListener('click', toggleRecording);
resetBtn.addEventListener('click', resetBuffer);
</script>

</body>
</html>
